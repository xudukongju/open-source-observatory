name: Collect public project evidence
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/registry.json', 'data/releases.json', 'scripts/collect.py', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: observatory-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm test
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Persist observation, including partial failures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public observations"
            git push
          fi
      - name: Surface source failures
        if: steps.collect.outcome == 'failure'
        run: exit 1
